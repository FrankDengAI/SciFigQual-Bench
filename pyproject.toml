[project]
name = "cs64"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub[cli]>=1.5.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "plotly>=6.7.0",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "flask>=3.0.0",
    "waitress>=3.0.0",
    "tqdm>=4.67.3",
    "transformers>=5.2.0",
    "typer>=0.12.0",
    "openai>=1.0.0",
    "anthropic>=0.49.0",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.5",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]
gpu = [
    "paddleocr>=2.10.0",
    "paddlepaddle-gpu==3.2.2",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
extra = [
    "accelerate>=1.12.0",
    "datasets>=4.6.1",
    "evaluate>=0.4.6",
    "protobuf>=7.34.0",
    "rapidfuzz>=3.14.3",
    "sentencepiece>=0.2.1",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
paddlepaddle-gpu = [{ index = "paddle-cu129" }]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
